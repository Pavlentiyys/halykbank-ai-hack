name: covenant-model

services:
  gemma:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        /bin/ollama serve &
        server_pid=$$!
        trap 'kill "$$server_pid" 2>/dev/null; wait "$$server_pid"' TERM INT
        until OLLAMA_HOST=127.0.0.1:11434 /bin/ollama list >/dev/null 2>&1; do
          sleep 1
        done
        OLLAMA_HOST=127.0.0.1:11434 /bin/ollama pull "$$GEMMA_MODEL_ID"
        wait "$$server_pid"
    environment:
      GEMMA_MODEL_ID: "${GEMMA_MODEL_ID:-gemma4:e2b}"
      OLLAMA_KEEP_ALIVE: 30m
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - gemma-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 /bin/ollama show \"$$GEMMA_MODEL_ID\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 720
      start_period: 10s
    stop_grace_period: 10s

volumes:
  gemma-models:
